name: build

on:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6
      - name: Set proper xcode version
        run: sh ./Scripts/xcodeselect.sh
      - name: Build the SDK
        run: ./scripts/build.sh